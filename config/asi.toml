# Konfiguracja ASI. Sekrety (klucz danych, tokeny) trzymaj w .env, nie tutaj.

signatures_dir = "signatures"

[server]
bind = "127.0.0.1:8080"
session_hours = 12
# Atrybut Secure cookie sesji (asi_session). Ustaw true, gdy aplikacja działa za HTTPS.
cookie_secure = false
# zbudowany frontend React (cd frontend && npm run build)
static_dir = "frontend/dist"

[database]
url = "sqlite://data/asi.db"

[scan]
nmap_binary = "nmap"
# Lista portów dla nmap -p (np. z listy dozwolonych portów od organizatora).
# Bez tej opcji używane jest --top-ports.
# ports = "21,22,23,25,53,80,110,143,443,445,3306,3389,5432,8000,8080,8443,9100"
top_ports = 1000
extra_nmap_args = ["-T3"]

# Łączny limit pakietów/s dzielony równo między równoległe procesy nmap.
global_max_rate = 2000
# Liczba równoległych procesów nmap (podgrup).
concurrency = 8
# Adaptacyjny podział na podgrupy: startowy / minimalny / maksymalny rozmiar
# i docelowy czas skanu jednej podgrupy.
chunk_size = 256
min_chunk = 16
max_chunk = 1024
target_chunk_secs = 300
host_timeout = "5m"

# Moduł HTTP/HTTPS
http_timeout_secs = 8
http_concurrency = 32
user_agent = "ASI-Scanner/0.1 (+security team discovery scan)"
# Czy pobierać dodatkowe ścieżki z sygnatur (GET, bez logowania).
probe_paths = true

# Ochrona przed przypadkowym skanem gigantycznego zakresu.
max_targets = 70000
# Po ilu kolejnych skanach bez odpowiedzi host jest uznawany za nieaktywny.
inactive_after_misses = 3
# Ponowny pomiar hostów, które zniknęły w bieżącym przebiegu.
recheck_missing = true

[schedule]
enabled = false
# Minimalny odstęp między pełnymi skanami.
every_hours = 24

# Okna czasowe. Skan, który nie zmieści się w oknie, jest zatrzymywany,
# a niezeskanowane adresy idą na początek kolejki w następnym oknie.
[[schedule.windows]]
start = "22:00"
end = "06:00"
days = []  # puste = codziennie; np. ["mon", "tue", "wed", "thu", "fri"]

[defectdojo]
url = "http://host.docker.internal:8081"
engagement_id = 1
token_env = "ASI_DD_TOKEN"
