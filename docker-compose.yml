name: ${ASI_PROJECT:-asi}

services:
  db:
    image: postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    restart: unless-stopped
    environment:
      POSTGRES_DB: asi
      POSTGRES_USER: asi
      POSTGRES_PASSWORD: ${ASI_DB_PASSWORD:?Ustaw ASI_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asi -d asi"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Klucz szyfrowania pól tworzony raz, w osobnym wolumenie (nie w wolumenie bazy).
  # W produkcji zamiast tego dostarcz plik klucza z zewnętrznego źródła sekretów (ASI_MASTER_KEY_FILE).
  keygen:
    image: alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
    command:
      - sh
      - -c
      - test -s /keys/master_key || (umask 077 && head -c 32 /dev/urandom | base64 > /keys/master_key); chown 10001 /keys/master_key
    volumes:
      - asi-keys:/keys

  asi:
    build: .
    image: asi:dev
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
      keygen:
        condition: service_completed_successfully
    environment:
      ASI_ADMIN_PASSWORD: ${ASI_ADMIN_PASSWORD:-}
      DATABASE_URL: postgres://asi:${ASI_DB_PASSWORD:?Ustaw ASI_DB_PASSWORD}@db:5432/asi
      ASI_MASTER_KEY_FILE: /run/asi-keys/master_key
      ASI_COOKIE_SECURE: ${ASI_COOKIE_SECURE:-false}
      ASI_SESSION_TTL_HOURS: ${ASI_SESSION_TTL_HOURS:-12}
      ASI_DD_URL: ${ASI_DD_URL:-}
      ASI_DD_TOKEN: ${ASI_DD_TOKEN:-}
      ASI_DD_PRODUCT: ${ASI_DD_PRODUCT:-}
      # opcjonalny klucz NVD API: wyższy limit zapytań przy sprawdzaniu podatności
      ASI_NVD_API_KEY: ${ASI_NVD_API_KEY:-}
    volumes:
      - asi-keys:/run/asi-keys:ro
      # konfigurację skanu i sygnatury można zmieniać bez przebudowy obrazu
      - ./${ASI_SCAN_CONFIG:-backend/config/scan.toml}:/app/config/scan.toml:ro
      - ./backend/signatures:/app/signatures:ro
    # DefectDojo uruchomione na hoście (np. ASI_DD_URL=http://host.docker.internal:8081)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${ASI_PORT:-8080}:8080"
    # SYN scan i wykrywanie hostów przez ICMP wymagają surowych gniazd:
    # user: root
    # cap_add: [NET_RAW, NET_ADMIN]

volumes:
  pgdata:
  asi-keys:
