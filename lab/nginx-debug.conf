# Serwer „staging” z nagłówkiem debugowym (ciekawy artefakt dla fingerprintingu).
server {
    listen 80;
    add_header X-Debug-Token "lab-debug-7f3a" always;
    add_header X-Environment "staging" always;
    location / {
        default_type text/html;
        return 200 "<html><head><title>Staging API (debug)</title></head><body>staging</body></html>";
    }
}
