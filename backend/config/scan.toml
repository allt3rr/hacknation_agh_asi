# Konfiguracja skanu ASI (ASI_SCAN_CONFIG). Wszystkie pola są opcjonalne; pominięte mają
# ostrożne wartości domyślne. Nieznane pola i błędne okna czasowe blokują start skanu.

nmap_binary = "nmap"

# Lista dozwolonych portów (np. od organizatora). Gdy ustawiona, nmap skanuje tylko te porty,
# a sondy HTTP mogą łączyć się wyłącznie z nimi. Bez niej: top_ports.
# ports = "21,22,25,53,80,110,143,443,445,3306,3389,5432,8000-8100,8443,9000,9090,9443"
top_ports = 100

# Łączny limit pakietów/s dzielony równo między procesy nmap.
global_max_rate = 500
concurrency = 4

# Adaptacyjne podgrupy: startowy / minimalny / maksymalny rozmiar i docelowy czas podgrupy (s).
chunk_size = 64
min_chunk = 8
max_chunk = 512
target_chunk_secs = 300
host_timeout = "5m"

# Sondy HTTP/HTTPS: tylko GET, bez logowania, odpowiedź czytana do 256 KiB.
http_timeout_secs = 8
http_concurrency = 16
probe_paths = true

max_targets = 70000
inactive_after_misses = 3
recheck_missing = true
max_chunk_attempts = 3

# Podatności po opublikowanym przebiegu: korelacja usług (nmap -sV / technologie z wersją) z CVE w NVD
# i ocena CVSS. mode: "ask" (pytanie w interfejsie), "auto" (od razu) albo "off" (tylko ręcznie).
# verify = true: dodatkowo nieinwazyjne szablony CVE nuclei (bez DoS/fuzz/intrusive/OOB/RCE/SQLi/logowania),
# tylko na usługach przebiegu w zakresie celów i portów i tylko w oknie czasowym harmonogramu. Potwierdza
# CVE z NVD i dodaje te, których korelacja wersji nie znalazła. Klucz NVD (wyższy limit): ASI_NVD_API_KEY.
[vuln]
mode = "ask"
verify = false
# nuclei_binary = "nuclei"
# nvd_url = "https://services.nvd.nist.gov/rest/json/cves/2.0"
# cache_hours = 24
# verify_rate = 20

# Ignorowane: harmonogram (pozycje z celami, częstotliwością i oknami) ustawia się w interfejsie
# (Skany → Harmonogram). Sekcja zostaje dla zgodności; okna nie ograniczają startu ręcznego.
[schedule]
enabled = false
every_hours = 24

# Okna czasowe (czas lokalny). Skan w oknie dostaje termin = koniec okna; po nim cały ruch
# (nmap, HTTP, ponowienia) jest przerywany, a zaległa praca wznawiana w następnym oknie.
# [[schedule.windows]]
# start = "22:00"
# end = "06:00"
# days = []   # puste = codziennie; np. ["mon", "tue", "wed", "thu", "fri"]
