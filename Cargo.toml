[package]
name = "asi-scanner"
version = "0.1.0"
edition = "2021"
description = "Attack Surface Intelligence: cykliczny discovery scan dużych sieci"
publish = false

[[bin]]
name = "asi"
path = "src/main.rs"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
axum-extra = { version = "0.9", features = ["cookie"] }
time = "0.3"
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
csv = "1.3"
ipnet = "2.9"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart"] }
quick-xml = { version = "0.36", features = ["serialize", "overlapped-lists"] }
x509-parser = "0.16"
sha2 = "0.10"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
